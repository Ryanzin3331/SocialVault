[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialvault-fase-a"
version = "0.1.0a0"
description = "Motor local de download de MP4 e conversão MP3 de mídias autorizadas do TikTok"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.1.1"]

[project.scripts]
socialvault = "socialvault.cli:main"

[tool.setuptools.packages.find]
include = ["socialvault*"]
